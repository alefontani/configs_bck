format = """$all$fill$cmd_duration$time\n$character"""

right_format = """"""

[line_break]
disabled = true

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[sudo]
style = 'bold green'
symbol = '_ '
disabled = false

[time]
disabled = false
format = '[$time]($style)' 
time_format = '%T'
utc_time_offset = 'local'
style = 'yellow'

[cmd_duration]
format = '⌛[$duration]($style) - '
style = 'yellow'

[aws]
symbol = "  "

